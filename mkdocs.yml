site_name: Free Crypto News
site_description: Free crypto news API - no API key, no signup, 120 requests per hour per IP
site_url: https://cryptocurrency.cv/docs
repo_url: https://github.com/nirholas/cryptocurrency.cv
repo_name: nirholas/free-crypto-news
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    # Dark mode (default)
    - scheme: slate
      primary: custom
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: custom
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    # Navigation
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    # TOC
    - toc.follow
    # Header
    - header.autohide
    - announce.dismiss

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nirholas/cryptocurrency.cv
    - icon: fontawesome/brands/discord
      link: https://discord.gg/cryptonews
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/freecryptonews
  generator: false
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation.

copyright: >
  Copyright &copy; 2024–2026 Free Crypto News –
  <a href="#__consent">Change cookie settings</a>

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Excluded from the build:
#   archive/                   legacy snapshots kept for history only
#   includes/abbreviations.md  auto-appended snippet, not a page
#   x402-llms-full-txt.md      machine-readable payload, not prose
#   README.md                  GitHub-only index; index.md is the site landing page
#                              (both would render to the same URL)
#   SCALABILITY.md             pointer stub; SCALING.md is the content
exclude_docs: |
  archive/
  includes/abbreviations.md
  x402-llms-full-txt.md
  README.md
  SCALABILITY.md

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
      enable_parallel_processing: false
  - glightbox
  - tags

